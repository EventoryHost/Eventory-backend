name: Deploy to EC2

on:
  push:
    branches:
      - prod
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEV_ENV: ${{ secrets.DEV_ENV }}
      PROD_ENV: ${{ secrets.PROD_ENV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEV_ENV,PROD_ENV,FIREBASE_SERVICE_ACCOUNT
          script: |
            set -e

            BRANCH=${{ github.ref_name }}

            # Determine APP_DIR + which ENV to use
            if [ "$BRANCH" = "prod" ]; then
              APP_DIR="prod"
              ENV_CONTENT="$PROD_ENV"
              FIREBASE_SERVICE_ACCOUNT="$FIREBASE_SERVICE_ACCOUNT"
              START_FILE="api/index.js"

            else
              APP_DIR="dev"
              ENV_CONTENT="$DEV_ENV"
              FIREBASE_SERVICE_ACCOUNT="$FIREBASE_SERVICE_ACCOUNT"
              START_FILE="api/index.js"
            fi

            echo "Deploying branch: $BRANCH"
            echo "Directory: $APP_DIR"
            echo "Start file: $START_FILE"

            cd ~

            # 1. Stop PM2 safely
            pm2 stop "$BRANCH" || true

            # 2. Remove old folder
            rm -rf "$APP_DIR"

            # 3. Clone fresh code
            git clone -b "$BRANCH" https://github.com/EventoryHost/Eventory-backend.git "$APP_DIR"

            cd "$APP_DIR"

            # 4. Write .env from GitHub Secret
            printf "%s\n" "$ENV_CONTENT" > .env
            printf "%s\n" "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json

            # 5. Install dependencies
            npm install --legacy-peer-deps

            # 6. Start PM2
            pm2 delete "$BRANCH" || true
            pm2 start "$START_FILE" --name "$BRANCH" --namespace "$BRANCH"

            # 7. Reload env properly
            pm2 restart "$BRANCH" --update-env

            pm2 save

            echo "Deployment of $BRANCH completed successfully."
